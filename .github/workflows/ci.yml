# SPDX-License-Identifier: GPL-3.0-or-later
#
# Continuous integration, run on every push and pull request.
#
# GitHub allows a fixed amount of CI time a month, and every push to every branch spends it,
# so what runs on a development branch or a pull request must be fast. A job or step that takes
# long runs on main only, with `if: github.ref == 'refs/heads/main'`: clang-tidy, and the taxi
# design regression. Whoever merges a pull request runs those locally first, because one that
# fails after the merge leaves main red.
#
# The default branch must stay green; a red default branch is fixed or reverted before other
# work continues.
#
# There is no scheduled job. A nightly run that publishes conformance pass rates and the
# benchmark series would be a useful addition, once there is somewhere to publish them.

name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 400M

jobs:
  lint:
    name: Format and license headers
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v4

      - name: Install tooling
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang-format-18

      # third_party/ is excluded for the same reason it is excluded from the
      # license check: those files are byte-identical copies of upstream, and
      # reformatting them to Enzan's style would turn the next update from a
      # straight re-copy into a merge.
      - name: Check formatting
        run: |
          mapfile -t files < <(git ls-files '*.h' '*.cpp' | grep -v '^third_party/')
          printf 'Checking %d files\n' "${#files[@]}"
          clang-format-18 --dry-run --Werror "${files[@]}"

      - name: Check SPDX license headers
        run: ./scripts/check-license-headers.sh

  build:
    name: ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        preset: [gcc-debug, gcc-release, clang-debug, clang-release]
    steps:
      # NVC, which the VHDL frontend builds part of, is a submodule.
      - uses: actions/checkout@v4
        with:
          submodules: true

      # flex and zstd build NVC's analysis, and GHDL is the reference the VHDL golden cases
      # are compared against. Python and cocotb are for the cocotb golden test of a VHDL
      # toplevel, through VHPI, and for cocotb's suite run with VHDL toplevels.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            cmake ninja-build ccache clang libgtest-dev zlib1g-dev flex libzstd-dev \
            ghdl ghdl-mcode python3 python3-venv libpython3-dev

      - name: Install cocotb
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet -r tests/conformance/cocotb/requirements.txt

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ matrix.preset }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.preset }}-

      # The defaults, but for the SystemVerilog frontend and the GUI, which would take too much
      # time to compile repeatedly.
      - name: Configure
        run: >
          cmake --preset ${{ matrix.preset }}
          -DENZAN_WERROR=ON
          -DENZAN_ENABLE_SYSTEMVERILOG=OFF
          -DENZAN_BUILD_GUI=OFF
          -DENZAN_COCOTB_PYTHON="$PWD/.venv/bin/python"

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      # The VESTs conformance suite, held to its pass list as sv-tests is. Seconds against this
      # build, so on every branch.
      - name: VESTs conformance suite
        if: matrix.preset == 'gcc-release'
        run: |
          status=0
          tests/conformance/vests/run-suite.sh build/gcc-release/bin/enzan build/vests \
            > build/vests.txt 2>&1 || status=$?
          grep -v -e '^FAIL ' -e '^PASS ' build/vests.txt
          { echo '```'; grep -v -e '^FAIL ' -e '^PASS ' build/vests.txt; echo '```'; } \
            >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # NVC's own regression tests, from the NVC the VHDL frontend is built on, held to their pass
      # list. About a minute against this build, so on every branch.
      - name: NVC regression tests
        if: matrix.preset == 'gcc-release'
        run: |
          status=0
          tests/conformance/nvc/run-suite.sh build/gcc-release/bin/enzan build/nvc \
            > build/nvc.txt 2>&1 || status=$?
          grep -v -e '^FAIL ' -e '^PASS ' build/nvc.txt
          { echo '```'; grep -v -e '^FAIL ' -e '^PASS ' build/nvc.txt; echo '```'; } \
            >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # GHDL's own regression tests, from the GHDL VESTs is run from, held to their pass
      # list. About a minute against this build, so on every branch.
      - name: GHDL regression tests
        if: matrix.preset == 'gcc-release'
        run: |
          status=0
          tests/conformance/ghdl/run-suite.sh build/gcc-release/bin/enzan build/ghdl \
            > build/ghdl.txt 2>&1 || status=$?
          grep -v -e '^FAIL ' -e '^PASS ' build/ghdl.txt
          { echo '```'; grep -v -e '^FAIL ' -e '^PASS ' build/ghdl.txt; echo '```'; } \
            >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # cocotb's own regression suite with VHDL toplevels, through VHPI, held to its own pass
      # list; the run with Verilog ones is in the SystemVerilog job.
      - name: cocotb regression suite, VHDL toplevels
        if: matrix.preset == 'gcc-release'
        env:
          COCOTB_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: |
          status=0
          PYTHON_VERSION=$(python3 -V | cut -d" " -f2) \
          tests/conformance/cocotb/run-suite.sh build/gcc-release/bin/enzan build/cocotb-vhdl \
            vhdl > build/cocotb-vhdl.txt 2>&1 || status=$?
          grep -v -e '^FAIL ' -e '^PASS ' build/cocotb-vhdl.txt
          { echo '```'; grep -v -e '^FAIL ' -e '^PASS ' build/cocotb-vhdl.txt; echo '```'; } \
            >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Report cache statistics
        if: always()
        run: ccache --show-stats

  sanitize:
    name: ASan + UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            cmake ninja-build ccache clang libgtest-dev zlib1g-dev flex libzstd-dev \
            ghdl ghdl-mcode qt6-base-dev tcl-dev

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-sanitize-${{ github.sha }}
          restore-keys: ccache-sanitize-

      # The build matrix's configuration, the defaults but for slang: NVC's analysis runs
      # instrumented, and so do the GUI's tests, a kernel and a window talking over a socket.
      - name: Configure
        run: >
          cmake --preset clang-sanitize
          -DENZAN_WERROR=ON
          -DENZAN_ENABLE_SYSTEMVERILOG=OFF

      - name: Build
        run: cmake --build --preset clang-sanitize

      # detect_leaks is on, and abort_on_error makes a finding fail the test
      # rather than print a report that scrolls past in a green log.
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --preset clang-sanitize

  tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            cmake ninja-build ccache clang clang-tidy-18 libgtest-dev zlib1g-dev \
            qt6-base-dev tcl-dev flex libzstd-dev

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-tidy-${{ github.sha }}
          restore-keys: ccache-tidy-

      # The defaults, which enable every optional component, even though that makes this the
      # second job that builds slang. Linting a translation unit that the configured build does
      # not compile does not merely skip it: clang-tidy falls back to default flags, fails to
      # find the slang, NVC or Qt headers, and then reports whatever its half-parsed view of the
      # file suggests. That produced nineteen findings that were not defects, and would have
      # hidden any real one behind them.
      - name: Configure
        run: cmake --preset clang-debug

      # The generated version header is produced at configure time, but
      # GoogleTest's headers may only appear after a build when they were
      # fetched, so the test targets are built before linting them.
      - name: Build
        run: cmake --build --preset clang-debug

      - name: Run clang-tidy
        run: |
          mapfile -t files < <(git ls-files 'src/*.cpp' 'tools/*.cpp' 'tests/*.cpp')
          printf 'Linting %d files\n' "${#files[@]}"
          clang-tidy-18 -p build/clang-debug --quiet "${files[@]}"

      - name: Report cache statistics
        if: always()
        run: ccache --show-stats

  gui:
    name: Graphical front end without the language frontends
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Qt 6 for the windows and Tcl for the theme; nothing of NVC's or slang's.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            cmake ninja-build ccache libgtest-dev zlib1g-dev qt6-base-dev tcl-dev

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          key: ccache-gui-${{ github.sha }}
          path: ${{ env.CCACHE_DIR }}
          restore-keys: ccache-gui-

      # Both frontends are off, which is this job's reason to exist now that the build matrix
      # builds the GUI too. The kernel and the front end are meant to be usable without slang
      # or NVC, and what is compiled only without them, behind the ENZAN_WITH_SYSTEMVERILOG and
      # ENZAN_WITH_VHDL guards of tools/enzan, src/session and src/pli, is compiled nowhere
      # else; a helper left on the wrong side of a guard is an unused function only here. The
      # front end's tests drive a kernel built from EIR they construct themselves, so they need
      # neither.
      - name: Configure
        run: >
          cmake --preset gcc-debug
          -DENZAN_WERROR=ON
          -DENZAN_ENABLE_SYSTEMVERILOG=OFF
          -DENZAN_ENABLE_VHDL=OFF

      - name: Build
        run: cmake --build --preset gcc-debug

      # No display is needed. The GUI tests choose the offscreen platform from inside the
      # binary rather than trusting the environment, so that they behave the same on a machine
      # with no session as in a desktop.
      - name: Test
        run: ctest --preset gcc-debug

      - name: Report cache statistics
        if: always()
        run: ccache --show-stats

  systemverilog:
    name: SystemVerilog frontend and golden suite, default configuration
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.ref == 'refs/heads/main' && 30 || 10 }}
    steps:
      # NVC, which the VHDL frontend builds part of, is a submodule.
      - uses: actions/checkout@v4
        with:
          submodules: true

      # iverilog is the reference the golden suite compares against. Running the same design
      # under two simulators and comparing the result is the single highest-value testing
      # strategy available, so it is not optional here even though the suite skips it
      # gracefully when no reference is installed.
      #
      # gtkwave is installed for one program: fst2vcd, which is how the suite checks that a
      # reader other than ours can get the design back out of an FST. Without it the FST cases
      # skip, and a writer that produced an unreadable file would go unnoticed here.
      #
      # libpython3-dev because cocotb embeds Python into the simulator it is loaded into, and
      # needs the shared library to do it.
      #
      # flex and zstd for NVC's analysis, and Qt 6 and Tcl for the GUI, which the default
      # configuration builds. GHDL is NEORV32's reference.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            cmake ninja-build ccache libgtest-dev zlib1g-dev python3 python3-venv \
            libpython3-dev iverilog gtkwave flex libzstd-dev qt6-base-dev tcl-dev ghdl \
            ghdl-mcode

      # The cocotb version is named once, in requirements.txt, and so is what sv-tests' driver
      # needs.
      - name: Install cocotb and sv-tests' driver requirements
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet -r tests/conformance/cocotb/requirements.txt \
            -r tests/conformance/sv-tests/requirements.txt

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-slang-${{ github.sha }}
          restore-keys: ccache-slang-

      # slang is not packaged by any distribution, so the FetchContent path is
      # the one contributors actually take. This job exists to catch a break in
      # it — an upstream revision that no longer builds, or a CMake option that
      # was renamed — at the commit that caused it rather than at the start of M1.
      # This is the only job that builds slang, which is why it is also the only one that runs
      # the frontend unit tests and the golden suite. The build matrix above configures the
      # frontend off: nothing outside this job links slang, and compiling it five times per
      # commit would spend most of the CI budget on one dependency.
      #
      # Everything else is the defaults too, the VHDL frontend and the GUI with it, so that the
      # configuration a plain `cmake --preset` gives a contributor is the one built and tested
      # on every commit, rather than only on main by clang-tidy's job.
      - name: Configure and build the default configuration
        run: |
          cmake --preset gcc-release -DENZAN_WERROR=ON \
            -DENZAN_COCOTB_PYTHON="$PWD/.venv/bin/python"
          cmake --build --preset gcc-release

      - name: Test
        run: ctest --preset gcc-release

      # cocotb's own regression suite. It fails the job when a case passing.txt lists stops
      # passing, and the pass rate goes into the job summary so that it is tracked where the
      # run is.
      - name: cocotb regression suite
        env:
          COCOTB_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: |
          status=0
          tests/conformance/cocotb/run-suite.sh build/gcc-release/bin/enzan build/cocotb-suite \
            > build/cocotb-suite.txt 2>&1 || status=$?
          cat build/cocotb-suite.txt
          { echo '```'; cat build/cocotb-suite.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Keep the cocotb logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cocotb-suite-logs
          path: build/cocotb-suite/*.log

      # The sv-tests conformance suite, held to its pass list as cocotb's is. It runs on every
      # branch because it takes well under a minute against this build.
      - name: sv-tests conformance suite
        env:
          SVTESTS_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: |
          status=0
          tests/conformance/sv-tests/run-suite.sh build/gcc-release/bin/enzan build/sv-tests \
            > build/sv-tests.txt 2>&1 || status=$?
          grep -v '^FAIL ' build/sv-tests.txt
          { echo '```'; grep -v '^FAIL ' build/sv-tests.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Keep the sv-tests logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sv-tests-logs
          path: build/sv-tests/out/logs

      # NVC's regression tests of VHDL with Verilog, which only this build, with both frontends, can
      # run, held to a pass list of their own. Seconds.
      - name: NVC regression tests, VHDL with Verilog
        run: |
          status=0
          tests/conformance/nvc/run-suite.sh build/gcc-release/bin/enzan build/nvc-mixed mixed \
            > build/nvc-mixed.txt 2>&1 || status=$?
          grep -v -e '^FAIL ' -e '^PASS ' build/nvc-mixed.txt
          { echo '```'; grep -v -e '^FAIL ' -e '^PASS ' build/nvc-mixed.txt; echo '```'; } \
            >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # The design regression: each design's own testbenches, held to their own verdicts and,
      # where Icarus Verilog can run them, to its transcript. Under a second here.
      - name: Design regression
        run: |
          status=0
          tests/designs/aes/run.sh build/gcc-release/bin/enzan "$(command -v iverilog)" \
            build/designs/aes || status=1
          tests/designs/common_cells/run.sh build/gcc-release/bin/enzan \
            build/designs/common_cells || status=1
          exit "$status"

      # The long running tests only execute on the main branch.
      - name: Design regression - long run
        if: github.ref == 'refs/heads/main'
        timeout-minutes: 5
        env:
          COCOTB_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: |
          .venv/bin/pip install --quiet -r tests/designs/taxi/requirements.txt
          status=0
          tests/designs/taxi/run.sh build/gcc-release/bin/enzan build/designs/taxi || status=1
          exit "$status"

      # NEORV32 through its own testbench's on-chip debugger sequence, and through the same
      # testbench in Verilog around its VHDL, each held to GHDL's reports of the VHDL testbench and
      # to its CPU trace and UART logs. A few minutes, so on the main branch only, in the one build
      # with both frontends.
      - name: Design regression - NEORV32
        if: github.ref == 'refs/heads/main'
        timeout-minutes: 5
        run: >
          tests/designs/neorv32/run.sh build/gcc-release/bin/enzan "$(command -v ghdl)" \
            build/designs/neorv32

      - name: Keep the NEORV32 logs
        if: failure() && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: neorv32-logs
          path: |
            build/designs/neorv32/differences.txt
            build/designs/neorv32/enzan/*.txt
            build/designs/neorv32/enzan-verilog/*.txt
            build/designs/neorv32/ghdl/transcript.txt

      - name: Keep the design regression logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: design-regression-logs
          path: |
            build/designs/aes/*.*
            build/designs/taxi/*.log
            build/designs/common_cells/*.*

      # The benchmark is a target rather than a test, because a measurement taken alongside three
      # hundred other tests compares with nothing. It runs here so that a change which breaks the
      # harness is caught, and so that a number is recorded per commit. Publishing the series, from
      # a nightly job say, waits until there is somewhere to publish it.
      - name: Benchmark
        run: cmake --build --preset gcc-release --target enzan-bench

      - name: Report cache statistics
        if: always()
        run: ccache --show-stats
